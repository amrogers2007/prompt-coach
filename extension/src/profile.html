<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Prompt Coach — Your Progress</title>
<style>
  :root {
    --bg: #f7f7f8; --card: #ffffff; --text: #1a1a1a; --muted: #6b6b70;
    --border: #e3e3e6; --accent: #2b59c3; --accent-wash: #eaf0fb;
    --improving: #1a8a4a; --slipping: #c0392b; --plateau: #8a8a8f;
  }
  * { box-sizing: border-box; }
  body {
    width: 320px; margin: 0; padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 13px;
  }
  h1 { font-size: 15px; margin: 0 0 2px; }
  p.sub { color: var(--muted); font-size: 11.5px; margin: 0 0 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .card h2 { font-size: 12px; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  .row-label { flex: 0 0 132px; font-size: 12px; }
  .row-bar-track { flex: 1; height: 8px; background: var(--accent-wash); border-radius: 4px; overflow: hidden; }
  .row-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .row-count { flex: 0 0 18px; text-align: right; font-size: 11px; color: var(--muted); }
  .trend { flex: 0 0 14px; text-align: center; font-size: 12px; }
  .trend.improving { color: var(--improving); }
  .trend.slipping { color: var(--slipping); }
  .trend.plateauing { color: var(--plateau); }
  .empty { color: var(--muted); font-size: 12px; padding: 4px 0; }
  .safety-note {
    font-size: 11.5px; color: var(--muted); margin-top: 8px; padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  button {
    width: 100%; border: 1px solid var(--border); background: var(--card); color: var(--muted);
    border-radius: 8px; padding: 7px; font-size: 12px; cursor: pointer;
  }
  button:hover { color: var(--text); border-color: #c9c9cd; }
</style>
</head>
<body>
  <h1>✨ Your Prompt Coach Progress</h1>
  <p class="sub">Local to this browser only — never sent anywhere.</p>

  <div class="card">
    <h2>Last 30 days</h2>
    <div id="snapshot"></div>
    <div id="safety-note" class="safety-note" style="display:none;"></div>
  </div>

  <button id="clear">Clear my data</button>

  <script src="profile.js"></script>
  <script>
    var CATEGORY_LABELS = {
      missingContext: "Missing Context",
      vagueAsk: "Vague / Ambiguous Ask",
      outputFormat: "No Output Format",
      tooBroad: "Too Broad in Scope",
      missingConstraints: "Missing Constraints",
      iterationMindset: "Doesn't Refine / Iterate",
      accuracyGrounding: "Accuracy / Grounding",
    };

    function render() {
      Promise.all([
        window.PromptCoachProfile.getSnapshot(30),
        window.PromptCoachProfile.getTrends(),
      ]).then(function (results) {
        var snapshot = results[0];
        var trends = results[1];
        var container = document.getElementById("snapshot");
        var safetyNote = document.getElementById("safety-note");

        var rows = Object.keys(CATEGORY_LABELS)
          .map(function (cat) { return { cat: cat, shown: (snapshot[cat] && snapshot[cat].shown) || 0 }; })
          .filter(function (r) { return r.shown > 0; })
          .sort(function (a, b) { return b.shown - a.shown; });

        if (rows.length === 0) {
          container.innerHTML = '<div class="empty">No coaching yet in the last 30 days — start typing a prompt on chatgpt.com, claude.ai, or gemini.google.com.</div>';
        } else {
          var max = rows[0].shown;
          container.innerHTML = rows.map(function (r) {
            var pct = Math.max(6, Math.round((r.shown / max) * 100));
            var trendInfo = trends[r.cat];
            var trendSymbol = "";
            var trendClass = "";
            if (trendInfo && trendInfo.trend !== "insufficient-data") {
              trendClass = trendInfo.trend;
              trendSymbol = trendInfo.trend === "improving" ? "▼" : trendInfo.trend === "slipping" ? "▲" : "▬";
            }
            return '<div class="row">' +
              '<div class="row-label">' + CATEGORY_LABELS[r.cat] + '</div>' +
              '<div class="row-bar-track"><div class="row-bar-fill" style="width:' + pct + '%"></div></div>' +
              '<div class="row-count">' + r.shown + '</div>' +
              '<div class="trend ' + trendClass + '" title="' + (trendInfo ? trendInfo.trend : "") + '">' + trendSymbol + '</div>' +
              '</div>';
          }).join("");
        }

        var safetyShown = (snapshot.safety && snapshot.safety.shown) || 0;
        if (safetyShown > 0) {
          safetyNote.style.display = "block";
          safetyNote.textContent = "⚠️ Sensitive-data pattern flagged " + safetyShown + " time" + (safetyShown === 1 ? "" : "s") + " in the last 30 days.";
        } else {
          safetyNote.style.display = "none";
        }
      });
    }

    document.getElementById("clear").addEventListener("click", function () {
      window.PromptCoachProfile.clearAll().then(render);
    });

    render();
  </script>
</body>
</html>
