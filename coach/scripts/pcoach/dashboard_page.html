<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your AI habits</title>
<style>
  :root {
    color-scheme: light;
    --page: #f2f2f5;
    --surface: #fcfcfb;
    --surface-2: #f4f4f1;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #7a7873;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.08);
    --series: #2a78d6;
    --series-soft: rgba(42, 120, 214, 0.16);
    --early: #86b6ef;
    --recent: #1c5cab;
    --good: #006300;
    --shadow: 0 1px 2px rgba(11, 11, 11, 0.04), 0 8px 24px rgba(11, 11, 11, 0.05);
    --pop: 0 8px 28px rgba(11, 11, 11, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #232322;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #9b998f;
      --grid: #2c2c2a;
      --axis: #4a4a46;
      --border: rgba(255, 255, 255, 0.10);
      --series: #3987e5;
      --series-soft: rgba(57, 135, 229, 0.22);
      --early: #1c5cab;
      --recent: #6da7ec;
      --good: #0ca30c;
      --shadow: none;
      --pop: 0 8px 28px rgba(0, 0, 0, 0.55);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232322;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #9b998f;
    --grid: #2c2c2a;
    --axis: #4a4a46;
    --border: rgba(255, 255, 255, 0.10);
    --series: #3987e5;
    --series-soft: rgba(57, 135, 229, 0.22);
    --early: #1c5cab;
    --recent: #6da7ec;
    --good: #0ca30c;
    --shadow: none;
    --pop: 0 8px 28px rgba(0, 0, 0, 0.55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 16px 64px; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; }
  header h1 { font-size: 30px; line-height: 1.15; margin: 0 0 2px; letter-spacing: -0.01em; }
  .lede { color: var(--ink-2); margin: 0; }
  .filters { display: flex; gap: 6px; }
  .filters button {
    font: inherit; font-size: 14px; color: var(--ink-2); background: transparent; border: 0;
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .filters button[aria-pressed="true"] { color: var(--ink); background: var(--surface); box-shadow: var(--shadow); font-weight: 600; }
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--series); outline-offset: 2px;
  }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; margin-top: 20px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow);
    padding: 20px 22px; grid-column: span 12; min-width: 0;
  }
  .span-4 { grid-column: span 4; }
  .span-6 { grid-column: span 6; }
  .span-8 { grid-column: span 8; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .card h2 { font-size: 16px; margin: 0; letter-spacing: -0.005em; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--series); margin: 0 0 6px; letter-spacing: 0.01em; }
  .card-sub { color: var(--ink-2); font-size: 14px; margin: 2px 0 0; }
  .ghost {
    font: inherit; font-size: 13px; color: var(--ink-2); background: transparent; white-space: nowrap;
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; cursor: pointer;
  }
  .ghost:hover { color: var(--ink); border-color: var(--axis); }
  .primary {
    font: inherit; font-size: 14px; font-weight: 600; color: #fff; background: var(--series); border: 0;
    border-radius: 999px; padding: 8px 16px; cursor: pointer;
  }
  .link { font: inherit; font-size: 13px; color: var(--series); background: none; border: 0; padding: 0; cursor: pointer; }
  /* hero */
  .hero { display: flex; gap: 22px; align-items: center; }
  .hero-text { min-width: 0; }
  .hero-value { font-size: 44px; font-weight: 700; line-height: 1; margin: 0; letter-spacing: -0.02em; }
  .hero-level { font-size: 15px; font-weight: 600; margin: 8px 0 0; }
  .delta { font-size: 14px; margin: 6px 0 0; color: var(--ink-2); }
  .delta.good { color: var(--good); font-weight: 600; }
  .hint { font-size: 13px; color: var(--ink-2); margin: 8px 0 0; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink);
    background: var(--series-soft); border-radius: 999px; padding: 3px 10px; margin-top: 12px;
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--series); }
  .ring-num { font-size: 34px; font-weight: 700; fill: var(--ink); }
  .ring-den { font-size: 12px; fill: var(--ink-2); }
  /* kpis */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi { min-width: 0; }
  .kpi-label { font-size: 13px; color: var(--ink-2); margin: 0; }
  .kpi-value { font-size: 30px; font-weight: 700; margin: 2px 0 0; line-height: 1.15; letter-spacing: -0.01em; }
  .kpi-sub { font-size: 13px; color: var(--ink-2); margin: 2px 0 0; }
  .kpi svg { display: block; margin-top: 8px; }
  /* what changed + divider */
  ul.changes { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 10px; }
  ul.changes li { display: flex; gap: 10px; align-items: baseline; }
  ul.changes .icon { flex: none; width: 18px; text-align: center; font-weight: 700; color: var(--ink-2); }
  ul.changes li.good .icon { color: var(--good); }
  ul.changes .tag { font-size: 12px; font-weight: 600; color: var(--ink-2); margin-left: 6px; white-space: nowrap; }
  ul.changes li.good .tag { color: var(--good); }
  .divider { margin: 4px 0 14px; }
  .divider svg { display: block; overflow: visible; touch-action: none; cursor: col-resize; border-radius: 8px; }
  .divider-labels { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); margin-top: 6px; gap: 12px; }
  .divider-labels b { color: var(--ink); font-weight: 600; }
  /* recap */
  .recap p { margin: 0 0 8px; }
  .recap .head { font-weight: 600; }
  .recap ul { margin: 0 0 8px; padding-left: 20px; }
  .recap li { margin: 2px 0; }
  .recap .try { color: var(--ink-2); }
  /* charts */
  .chart { width: 100%; }
  .chart svg { display: block; overflow: visible; }
  .tick { font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .end-label { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .goal-label { font-size: 12px; font-weight: 600; fill: var(--ink-2); }
  .hit { cursor: crosshair; outline: none; }
  .bar-hit { cursor: default; outline: none; }
  .small-multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 18px; }
  .sm h3 { font-size: 14px; margin: 0; }
  .sm p { font-size: 13px; color: var(--ink-2); margin: 0 0 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--ink-2); margin: 0 0 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  /* gaps */
  .gap { border-top: 1px solid var(--grid); }
  .gap:first-of-type { border-top: 0; }
  .gap-row {
    width: 100%; display: block; text-align: left; font: inherit; color: inherit; background: none; border: 0;
    padding: 10px 0; cursor: pointer; border-radius: 8px;
  }
  .gap-row:hover { background: color-mix(in srgb, var(--grid) 40%, transparent); }
  .gap-name { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin: 0 0 4px; }
  .gap-name .chev { color: var(--muted); font-size: 12px; transition: transform 0.15s; }
  .gap-row[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .gap-detail { padding: 4px 0 16px; display: grid; gap: 12px; }
  .gap-detail h4 { font-size: 13px; color: var(--ink-2); font-weight: 600; margin: 0 0 2px; }
  .gap-detail p { margin: 0; }
  .example { display: grid; gap: 8px; }
  .ex { border-radius: 12px; padding: 10px 12px; background: var(--surface-2); }
  .ex .lbl { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 0 0 2px; }
  .ex.after { border: 1px solid var(--series-soft); }
  .ex q { quotes: "“" "”"; }
  .ex-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .db-axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
  /* goal */
  .goal-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-top: 8px; }
  .goal-form label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
  .goal-form select, .goal-form input {
    font: inherit; font-size: 14px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 7px 10px;
  }
  .goal-line { font-size: 18px; font-weight: 600; margin: 0; }
  .meter { height: 8px; border-radius: 999px; background: var(--series-soft); margin: 12px 0 6px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--series); border-radius: 999px; }
  .meter-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .status { font-size: 14px; margin: 10px 0 0; }
  .status b { font-weight: 600; }
  ul.needs { margin: 8px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 14px; }
  .goal-actions { display: flex; gap: 14px; margin-top: 10px; }
  /* milestones */
  .miles { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; }
  .miles > div { min-width: 0; }
  .streak-num { font-size: 40px; font-weight: 700; line-height: 1; margin: 0; letter-spacing: -0.02em; }
  .streak-num small { font-size: 15px; font-weight: 500; color: var(--ink-2); }
  .cal { display: grid; grid-template-columns: repeat(7, 22px); gap: 6px; margin-top: 12px; }
  .cal-day { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--grid); background: transparent; }
  .cal-day.used { border-color: var(--series); }
  .cal-day.good { border-color: var(--series); background: var(--series); }
  .cal-day.future { border-color: transparent; }
  .cal-legend { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); margin-top: 12px; }
  .cal-legend span { display: inline-flex; align-items: center; gap: 8px; }
  .cal-legend .cal-day { width: 12px; height: 12px; border-width: 2px; }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .badge { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .badge svg { flex: none; }
  .badge h3 { font-size: 14px; margin: 0; }
  .badge p { font-size: 12px; color: var(--ink-2); margin: 2px 0 0; }
  .badge.locked h3 { color: var(--ink-2); font-weight: 500; }
  .badge-check { font-size: 15px; font-weight: 700; fill: var(--series); }
  .badge-frac { font-size: 11px; font-weight: 600; fill: var(--ink-2); }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  table.data th, table.data td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  table.data th { color: var(--ink-2); font-weight: 600; }
  .table-box { overflow-x: auto; }
  .empty { text-align: center; padding: 48px 20px; color: var(--ink-2); }
  .empty h2 { color: var(--ink); }
  .note { font-size: 14px; color: var(--ink-2); margin: 0; }
  footer { margin-top: 28px; font-size: 13px; color: var(--ink-2); }
  #tip {
    position: fixed; z-index: 10; pointer-events: none; max-width: 260px;
    background: var(--surface); color: var(--ink); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--pop); padding: 8px 10px; font-size: 13px;
  }
  #tip .t-title { color: var(--ink-2); margin-bottom: 2px; }
  #tip .t-row { display: flex; align-items: center; gap: 6px; }
  #tip .t-row strong { font-size: 14px; }
  #tip .t-key { width: 12px; height: 2px; border-radius: 1px; flex: none; }
  #tip .t-row span.lbl { color: var(--ink-2); }
  @media (max-width: 860px) {
    .span-4, .span-6, .span-8 { grid-column: span 12; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .miles { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) {
    .hero { gap: 16px; }
    .hero-value { font-size: 36px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Your AI habits</h1>
      <p class="lede" id="lede">How you use AI, and how it's changing.</p>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Time range"></div>
  </header>
  <main class="grid" id="main"></main>
  <footer id="foot">
    Made on this computer from numbers the coach keeps. Your messages are never stored, and this page loads nothing
    from the internet.
  </footer>
</div>
<div id="tip" role="status" aria-live="polite" hidden></div>
<script type="application/json" id="data">/*__DATA__*/null</script>
<script>
(function () {
  "use strict";
  var DATA = null;
  try { DATA = JSON.parse(document.getElementById("data").textContent); } catch (e) { DATA = null; }
  DATA = DATA || { rows: [], empty: true };
  var NS = "http://www.w3.org/2000/svg";
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var LEVELS = ["Beginner", "Practitioner", "Advanced", "Expert"];
  var SUM_KEYS = ["prompts", "new", "ctx_sum", "ctx_n", "prec_sum", "prec_n", "verify", "feat_yes", "feat_n",
                  "coached", "taken", "declined", "misfit", "docs", "docs_done", "docs_revised"];
  var PHRASES = {
    context: ["You give the AI more context", "You're giving the AI less context", true],
    precision: ["You say more often what a good answer looks like", "You say less often what a good answer looks like", true],
    verification: ["You ask the AI to check its work more often", "You ask the AI to check its work less often", false],
    iteration: ["You revise more of the documents AI makes for you", "You accept more first drafts as they are", false],
    feature: ["You work from files more often instead of pasting", "You paste text more often instead of using files", false]
  };
  var state = { range: "all", split: null, openGap: null, goal: loadGoal(), tables: {} };
  var TODAY = DATA.last_day || null;

  // ---- storage (per-viewer conveniences only) ----------------------------------------------
  function loadGoal() {
    try {
      var g = JSON.parse(localStorage.getItem("pc-goal") || "null");
      if (g && g.level >= 2 && g.level <= 4 && /^\d{4}-\d{2}-\d{2}$/.test(g.date || "")) return g;
    } catch (e) { /* storage may be unavailable */ }
    return null;
  }
  function saveGoal(g) {
    try { if (g) localStorage.setItem("pc-goal", JSON.stringify(g)); else localStorage.removeItem("pc-goal"); } catch (e) { /* ignore */ }
  }

  // ---- small helpers ---------------------------------------------------------------------------
  function h(tag, props) {
    var n = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined || c === false) continue;
      if (Array.isArray(c)) c.forEach(function (x) { if (x) n.append(x); });
      else n.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return n;
  }
  function sv(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    });
    if (parent) parent.appendChild(n);
    return n;
  }
  function svText(parent, attrs, text) { var t = sv("text", attrs, parent); t.textContent = text; return t; }
  function parseDay(d) { var p = d.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function iso(x) {
    return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
  }
  function addDays(d, n) { var x = parseDay(d); x.setDate(x.getDate() + n); return iso(x); }
  function daysBetween(a, b) { return Math.round((parseDay(b) - parseDay(a)) / 86400000); }
  function fmtDay(d) { var x = parseDay(d); return MON[x.getMonth()] + " " + x.getDate(); }
  function fmtDayYear(d) { var x = parseDay(d); return MON[x.getMonth()] + " " + x.getDate() + ", " + x.getFullYear(); }
  function fmtStamp(ts) { var x = new Date(ts * 1000); return MON[x.getMonth()] + " " + x.getDate() + ", " + x.getFullYear(); }
  function weekOf(d) { var x = parseDay(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return iso(x); }
  function round(v) { return v === null || v === undefined ? "–" : String(Math.round(v)); }
  function pct(v) { return v === null || v === undefined ? "–" : Math.round(v) + "%"; }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : (many || one + "s")); }
  function niceMax(v) {
    if (v <= 5) return 5;
    var p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
  }
  function copyText(text, btn) {
    var done = function () { var old = btn.textContent; btn.textContent = "Copied"; setTimeout(function () { btn.textContent = old; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(); });
    } else fallback();
    function fallback() {
      var ta = h("textarea", { style: "position:fixed;left:-9999px;top:0" });
      ta.value = text; document.body.append(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { btn.textContent = "Select and copy the text above"; }
      ta.remove();
    }
  }

  // ---- data shaping --------------------------------------------------------------------------------
  function merge(rows, key, label) {
    var b = { key: key, label: label, activeDays: 0, goodDays: 0, issues: {}, score: null, level: null,
              first: rows.length ? rows[0].day : null, last: rows.length ? rows[rows.length - 1].day : null };
    SUM_KEYS.forEach(function (k) { b[k] = 0; });
    rows.forEach(function (r) {
      SUM_KEYS.forEach(function (k) { b[k] += r[k] || 0; });
      if (r.prompts > 0) b.activeDays++;
      if (r.good_day) b.goodDays++;
      Object.keys(r.issues || {}).forEach(function (t) { b.issues[t] = (b.issues[t] || 0) + r.issues[t]; });
      if (r.score !== null && r.score !== undefined) { b.score = r.score; b.level = r.level; }
    });
    return b;
  }
  function bucketize(rows) {
    var weekly = rows.length > 35, order = [], groups = {};
    rows.forEach(function (r) {
      var k = weekly ? weekOf(r.day) : r.day;
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(r);
    });
    return { weekly: weekly, days: weekly ? 7 : 1, buckets: order.map(function (k) {
      return merge(groups[k], k, weekly ? "Week of " + fmtDay(k) : fmtDay(k));
    }) };
  }
  function habit(b, key) {
    if (key === "context") return b.ctx_n ? 100 * b.ctx_sum / b.ctx_n : null;
    if (key === "precision") return b.prec_n ? 100 * b.prec_sum / b.prec_n : null;
    if (key === "verification") return b.new ? 100 * b.verify / b.new : null;
    if (key === "iteration") return b.docs_done ? 100 * b.docs_revised / b.docs_done : null;
    if (key === "feature") return b.feat_n ? 100 * b.feat_yes / b.feat_n : null;
    return null;
  }
  function issueRate(b, t) { return b.prompts ? 100 * (b.issues[t] || 0) / b.prompts : null; }
  function rowsInRange() { return state.range === "all" ? DATA.rows : DATA.rows.slice(-Number(state.range)); }
  function defaultSplit(rows) {
    // The day "recently" starts: half of the messages fall on each side.
    var total = rows.reduce(function (a, r) { return a + r.prompts; }, 0);
    if (total < 10) return null;
    var acc = 0;
    for (var i = 0; i < rows.length; i++) {
      acc += rows[i].prompts;
      if (acc >= total / 2) {
        var rest = rows.slice(i + 1).reduce(function (a, r) { return a + r.prompts; }, 0);
        return rest >= 3 && i + 1 < rows.length ? rows[i + 1].day : null;
      }
    }
    return null;
