name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coach:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s coach/tests -v
      - run: python coach/scripts/build_zip.py
      - run: python coach/scripts/build_chat_skill.py
